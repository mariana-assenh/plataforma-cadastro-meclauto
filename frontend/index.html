<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MECLAUTO — Agendar atendimento</title>
  <link rel="icon" href="assets/logo-meclauto.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <header class="topo">
    <img class="logo" src="assets/logo-meclauto.png" alt="MECLAUTO — Híbridos, Elétricos e Combustão" />
    <div class="titulos">
      <strong>MECLAUTO</strong>
      <span>Agendamento de atendimento</span>
    </div>
  </header>

  <main>
    <div class="card">
      <p>Preencha os dados abaixo para solicitar um horário. Nossa equipe confirma o agendamento e entra em contato se precisar de mais alguma informação.</p>

      <form id="form-agendamento">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" required autocomplete="name" />

        <label for="telefone">Telefone (WhatsApp)</label>
        <input id="telefone" name="telefone" required autocomplete="tel" placeholder="(11) 99999-9999" />

        <label for="email">Email (opcional)</label>
        <input id="email" name="email" type="email" autocomplete="email" />

        <label for="endereco">Endereço (opcional)</label>
        <input id="endereco" name="endereco" autocomplete="street-address" />

        <label for="placa">Placa do carro</label>
        <input id="placa" name="placa" required placeholder="ABC1D23" />

        <div class="checkbox-linha">
          <input id="precisa_guincho" name="precisa_guincho" type="checkbox" />
          <label for="precisa_guincho" style="margin:0;">Preciso de guincho</label>
        </div>

        <label for="descricao_problema">Descreva o problema do carro</label>
        <textarea id="descricao_problema" name="descricao_problema" required></textarea>

        <label for="data_agendamento">Data desejada</label>
        <input id="data_agendamento" name="data_agendamento" type="date" required />

        <label for="hora_agendamento">Horário desejado</label>
        <input id="hora_agendamento" name="hora_agendamento" type="time" required />

        <div class="cf-turnstile" data-sitekey="SUA_SITE_KEY_DO_TURNSTILE" style="margin-top:1rem;"></div>

        <button type="submit">Solicitar agendamento</button>
      </form>

      <div id="mensagem"></div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
