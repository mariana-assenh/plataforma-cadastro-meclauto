name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker

  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: oficina-frontend
          directory: frontend

# Segredos necessários no repositório (Settings → Secrets and variables → Actions):
#   CF_API_TOKEN   — token da Cloudflare com permissão de Workers + Pages
#   CF_ACCOUNT_ID  — id da conta Cloudflare (o mesmo do outro projeto, se for reaproveitar)
#
# Os segredos do Worker (Supabase, Google, Turnstile) NÃO ficam aqui —
# são configurados uma vez com `wrangler secret put` (veja o README).
