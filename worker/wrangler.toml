# Worker exclusivo da MECLAUTO.
# O nome precisa ser diferente do Worker da Five Garage: como as duas
# oficinas usam a mesma conta Cloudflare, um nome repetido faria um
# deploy sobrescrever o outro. Tem que ser igual ao nome do Worker no painel.
name = "meclauto-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Não apagar no deploy as variáveis criadas pelo painel da Cloudflare
keep_vars = true

# Variáveis não-secretas podem ficar aqui.
# Segredos (chaves) NUNCA vão neste arquivo — configure com:
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY   (chave secreta do projeto Supabase da MECLAUTO)
#   npx wrangler secret put SUPABASE_ANON_KEY           (chave pública do projeto Supabase da MECLAUTO)
#   GOOGLE_SCRIPT_URL     (URL /exec do App da Web do Apps Script — apps-script/Code.gs)
#   GOOGLE_SCRIPT_TOKEN   (token gerado pela função configurar() do script)
#
# ATENÇÃO: use só chaves do projeto Supabase da MECLAUTO, nunca as da Five Garage.
[vars]
SUPABASE_URL = "https://guxevmwqhpfgbvobzzaz.supabase.co"
# Endereços do site que podem chamar a API (separados por vírgula)
ALLOWED_ORIGIN = "https://meclauto.com.br,https://www.meclauto.com.br"
